# Dependabot propose chaque semaine les mises à jour des dépendances PHP et JavaScript, vers develop.
# Les mises à jour mineures et correctives arrivent groupées, en une seule demande de fusion.
version: 2
updates:
  - package-ecosystem: composer
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      mineures:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      mineures:
        update-types: [minor, patch]
